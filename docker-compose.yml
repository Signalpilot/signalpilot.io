services:
  signalpilot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persist risk state across restarts
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot scanner (run with: docker compose run scanner)
  scanner:
    build: .
    env_file: .env
    command: ["python", "scan.py"]
    profiles: ["tools"]
