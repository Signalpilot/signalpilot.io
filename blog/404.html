<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://www.signalpilot.io/blog/">
    <title>Page Not Found - Signal Pilot Blog</title>
    <script>
        (function() {
            var path = window.location.pathname;
            var langs = ['ar', 'de', 'es', 'fr', 'hu', 'it', 'ja', 'nl', 'pt', 'ru', 'tr'];

            // Check for old URL pattern: /lang/articles/slug/ -> /articles/slug/lang/
            for (var i = 0; i < langs.length; i++) {
                var lang = langs[i];
                var oldPattern = new RegExp('^\\/' + lang + '\\/articles\\/([^\\/]+)\\/?$');
                var match = path.match(oldPattern);
                if (match) {
                    var newUrl = '/articles/' + match[1] + '/' + lang + '/';
                    window.location.replace(newUrl);
                    return;
                }
            }
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0a0a0a;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 { font-size: 4rem; margin: 0; color: #3b82f6; }
        p { color: #888; margin: 1rem 0; }
        a { color: #3b82f6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page not found</p>
        <a href="/blog/">Back to Home</a>
    </div>
</body>
</html>
