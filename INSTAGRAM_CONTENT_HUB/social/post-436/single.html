<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 436</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #0A1A1A; --cine-teal: #2DD4BF; --cine-teal-glow: #14B8A6; --cine-teal-subtle: #134E4A; --cine-teal-text: #CCFBF1; --cine-teal-secondary: #5EEAD4; --cine-teal-accent: #2DD4BF; --text-primary: #e8e8e8; --text-dim: #6a6a6a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; align-items: center; }
    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .preview-label { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
    .post-frame { width: 540px; height: 540px; position: relative; background: var(--bg-dark); border-radius: 16px; overflow: hidden; box-shadow: 0 0 60px rgba(45, 212, 191, 0.12), 0 4px 24px rgba(0, 0, 0, 0.5); }
    .post-frame::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(to bottom, transparent 0%, var(--cine-teal) 20%, var(--cine-teal-glow) 50%, var(--cine-teal) 80%, transparent 100%); z-index: 10; }
    .post-frame::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(45, 212, 191, 0.08) 0%, transparent 50%, rgba(19, 78, 74, 0.05) 100%); pointer-events: none; z-index: 1; }
    .post-content { position: relative; z-index: 5; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 48px; text-align: center; }
    .corner-accent-tl { position: absolute; top: 24px; left: 24px; width: 40px; height: 40px; border-left: 2px solid var(--cine-teal-subtle); border-top: 2px solid var(--cine-teal-subtle); }
    .corner-accent-br { position: absolute; bottom: 24px; right: 24px; width: 40px; height: 40px; border-right: 2px solid var(--cine-teal-subtle); border-bottom: 2px solid var(--cine-teal-subtle); }
    .post-type { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--cine-teal-accent); margin-bottom: 24px; padding: 6px 16px; border: 1px solid var(--cine-teal-subtle); border-radius: 20px; }
    .post-icon { font-size: 40px; margin-bottom: 16px; }
    .post-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; color: var(--cine-teal-text); line-height: 1.2; margin-bottom: 20px; max-width: 90%; text-shadow: 0 2px 20px rgba(45, 212, 191, 0.15); }
    .divider { width: 60px; height: 3px; background: linear-gradient(90deg, var(--cine-teal-accent), var(--cine-teal)); border-radius: 2px; margin-bottom: 20px; }
    .post-subtitle { font-size: 17px; color: var(--cine-teal-secondary); font-weight: 400; line-height: 1.5; max-width: 85%; font-style: italic; }
    .brand-mark { position: absolute; bottom: 24px; font-size: 11px; font-weight: 500; letter-spacing: 2px; color: var(--cine-teal-subtle); }
    .export-mode .post-frame { width: 1080px; height: 1080px; border-radius: 0; }
    .export-mode .post-content { padding: 96px; }
    .export-mode .post-title { font-size: 64px; }
    .export-mode .post-subtitle { font-size: 30px; }
    .export-mode .post-icon { font-size: 72px; }
  </style>
</head>
<body>
  <div class="preview-container">
    <span class="preview-label">Post 436 &mdash; Chronicle</span>
    <div class="post-frame">
      <div class="corner-accent-tl"></div>
      <div class="corner-accent-br"></div>
      <div class="post-content">
        <span class="post-type">Chronicle</span>
        <div class="post-icon">&#x1F6E1;</div>
        <h1 class="post-title">The Watchman&rsquo;s Vigil</h1>
        <div class="divider"></div>
        <p class="post-subtitle">The Watchman never sleeps. When confluence aligns, I sound the alert.</p>
        <span class="brand-mark">SIGNALPILOT</span>
      </div>
    </div>
  </div>
</body>
</html>
