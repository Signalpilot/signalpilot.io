<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 396</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #1A0F0A; --cine-orange: #E07B4B; --cine-orange-glow: #EA580C; --cine-orange-subtle: #7C2D12; --cine-orange-text: #FFEDD5; --cine-orange-secondary: #FDBA74; --cine-orange-accent: #F97316; --text-primary: #e8e8e8; --text-dim: #6a6a6a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; align-items: center; }
    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .preview-label { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
    .post-frame { width: 540px; height: 540px; position: relative; background: var(--bg-dark); border-radius: 16px; overflow: hidden; box-shadow: 0 0 60px rgba(234, 88, 12, 0.15), 0 4px 24px rgba(0, 0, 0, 0.5); }
    .post-frame::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(to bottom, transparent 0%, var(--cine-orange) 20%, var(--cine-orange-glow) 50%, var(--cine-orange) 80%, transparent 100%); z-index: 10; }
    .post-frame::after { content: ''; position: absolute; inset: 0; background: linear-gradient(225deg, rgba(234, 88, 12, 0.1) 0%, transparent 50%, rgba(124, 45, 18, 0.05) 100%); pointer-events: none; z-index: 1; }
    .post-content { position: relative; z-index: 5; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 48px; text-align: center; }
    .corner-accent-tr { position: absolute; top: 24px; right: 24px; width: 40px; height: 40px; border-right: 2px solid var(--cine-orange-subtle); border-top: 2px solid var(--cine-orange-subtle); }
    .corner-accent-bl { position: absolute; bottom: 24px; left: 24px; width: 40px; height: 40px; border-left: 2px solid var(--cine-orange-subtle); border-bottom: 2px solid var(--cine-orange-subtle); }
    .post-type { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--cine-orange-accent); margin-bottom: 32px; padding: 6px 16px; border: 1px solid var(--cine-orange-subtle); border-radius: 20px; }
    .post-title { font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 700; color: var(--cine-orange-text); line-height: 1.2; margin-bottom: 24px; max-width: 90%; text-shadow: 0 2px 20px rgba(234, 88, 12, 0.15); }
    .divider { width: 60px; height: 3px; background: linear-gradient(90deg, var(--cine-orange-accent), var(--cine-orange)); border-radius: 2px; margin-bottom: 24px; }
    .post-subtitle { font-size: 18px; color: var(--cine-orange-secondary); font-weight: 400; line-height: 1.5; margin-bottom: 32px; max-width: 85%; }
    .cta { font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--cine-orange-accent); padding: 10px 24px; border: 1px solid var(--cine-orange-accent); border-radius: 24px; }
    .brand-mark { position: absolute; bottom: 24px; font-size: 11px; font-weight: 500; letter-spacing: 2px; color: var(--cine-orange-subtle); }
    .export-mode .post-frame { width: 1080px; height: 1080px; border-radius: 0; }
    .export-mode .post-content { padding: 96px; }
    .export-mode .post-title { font-size: 64px; }
    .export-mode .post-subtitle { font-size: 32px; }
  </style>
</head>
<body>
  <div class="preview-container">
    <span class="preview-label">Post 396 &mdash; Marketing</span>
    <div class="post-frame">
      <div class="corner-accent-tr"></div>
      <div class="corner-accent-bl"></div>
      <div class="post-content">
        <span class="post-type">Marketing</span>
        <h1 class="post-title">Free Education Access</h1>
        <div class="divider"></div>
        <p class="post-subtitle">85 lessons. Zero cost. No catch. Education shouldn&rsquo;t be gatekept.</p>
        <span class="cta">Link in Bio</span>
        <span class="brand-mark">SIGNALPILOT</span>
      </div>
    </div>
  </div>
</body>
</html>
