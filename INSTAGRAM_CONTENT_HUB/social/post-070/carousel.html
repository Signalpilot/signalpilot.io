<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 070 — Janus Atlas Timeframe Guide | Carousel Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Gugi&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --bg-card: rgba(255,255,255,0.03);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.7);
      --text-muted: rgba(255,255,255,0.4);
      --border-subtle: rgba(255,255,255,0.1);
      --accent-teal: #5eead4;
      --accent-teal-dim: rgba(94,234,212,0.3);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-sans); background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; padding: 2rem; }
    body.export-mode { padding: 0; background: transparent; }
    body.export-mode .controls, body.export-mode .page-title, body.export-mode .slide-label { display: none; }
    body.export-mode .carousel-grid { display: block; }
    body.export-mode .slide-wrapper { display: none; margin: 0; }
    body.export-mode .slide-wrapper.active { display: block; }
    body.export-mode .slide { width: 1080px; height: 1350px; max-width: none; border-radius: 0; }

    .controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .controls label { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.875rem; }
    .controls select, .controls button { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; cursor: pointer; }
    .page-title { text-align: center; margin-bottom: 2rem; }
    .page-title h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 600; margin-bottom: 0.5rem; }
    .page-title p { color: var(--text-muted); font-size: 0.875rem; }

    .carousel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 2rem; max-width: 1800px; margin: 0 auto; }
    .slide-wrapper { display: flex; flex-direction: column; align-items: center; container-type: inline-size; }
    .slide-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .slide { width: 100%; max-width: 540px; aspect-ratio: 4 / 5; background: var(--bg-dark); border-radius: 0.5rem; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.06; z-index: 0; pointer-events: none; }
    .slide-content { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; padding: 5.5% 5.5% 10% 5.5%; }

    .slide-logo {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Gugi', sans-serif;
      font-size: clamp(0.4rem, 1.2cqw, 0.625rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(94,234,212,0.4);
      z-index: 2;
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════════
       SHARED — Teal slide base (LEFT bar)
       ═══════════════════════════════════════════ */
    .slide-teal { background: linear-gradient(180deg, #0a0c0f 0%, #080a0c 100%) !important; }
    .slide-teal::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(94,234,212,0.06) 0%, transparent 100%); pointer-events: none; z-index: 1; }
    .slide-teal.slide-1::after { content: ''; position: absolute; top: 0; left: 15px; width: 50px; height: 100%; background: #5eead4; z-index: 5; }
    .slide-teal .slide-content { z-index: 3; }

    .janus-label {
      font-family: var(--font-mono);
      font-size: clamp(7px, 1.3cqw, 13px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(94,234,212,0.9);
      margin-bottom: 3%;
    }

    .janus-divider {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(94,234,212,0.6), transparent);
      margin-bottom: 4%;
    }

    .janus-accent { color: var(--accent-teal); }

    /* ═══════════════════════════════════════════
       SLIDE 1 — Hook
       ═══════════════════════════════════════════ */
    .slide-1 .slide-content { align-items: center; text-align: center; justify-content: center; }

    .janus-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 5.5cqw, 60px);
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 4%;
    }

    .janus-subtitle {
      font-family: var(--font-serif);
      font-size: clamp(12px, 2.2cqw, 24px);
      font-weight: 400;
      font-style: italic;
      color: rgba(94,234,212,0.5);
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (max-width: 768px) { .carousel-grid { grid-template-columns: 1fr !important; } .slide.slide-1::after { display: none; } }
  </style>
</head>
<body>
  <div class="controls">
    <label>Background: <select id="bg-toggle"><option value="video">Starfield</option><option value="static">Static</option></select></label>
    <label>Opacity: <select id="opacity-control"><option value="0.06">6%</option><option value="0.08">8%</option><option value="0.12">12%</option></select></label>
    <button id="export-btn">Export Mode</button>
  </div>

  <div class="page-title">
    <h1>Post 070 — Janus Atlas Timeframe Guide</h1>
    <p>6 slides · Reference</p>
  </div>

  <div class="carousel-grid">

    <!-- ══════ SLIDE 1: Hook ══════ -->
    <div class="slide-wrapper" data-slide="1">
      <span class="slide-label">Slide 1 — Hook</span>
      <div class="slide slide-teal slide-1">
        <video class="video-bg" autoplay muted loop playsinline>
          <source src="../../assets/starfield.mp4" type="video/mp4">
        </video>
        <div class="slide-content">
          <div class="janus-label">REFERENCE</div>
          <div class="janus-divider"></div>
          <div class="janus-title">Janus Atlas<br><span class="janus-accent">Timeframe</span> Guide</div>
          <div class="janus-divider"></div>
          <div class="janus-subtitle">Match your timeframe to your strategy.</div>
          <div class="slide-logo">Signal Pilot</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Export Navigation ── -->
  <div class="export-nav">
    <button onclick="prevSlide()">&#8592; Previous</button>
    <span class="slide-indicator"><span id="currentSlideNum">1</span> / 1</span>
    <button onclick="nextSlide()">Next &#8594;</button>
  </div>

  <script>
    (function() {
      const bgToggle = document.getElementById('bg-toggle');
      const opacityControl = document.getElementById('opacity-control');
      const exportBtn = document.getElementById('export-btn');
      const videos = document.querySelectorAll('.video-bg');
      const slideWrappers = document.querySelectorAll('.slide-wrapper');
      let exportMode = false;
      let currentSlide = 0;

      bgToggle.addEventListener('change', function() {
        videos.forEach(v => { v.style.display = this.value === 'video' ? 'block' : 'none'; });
      });
      opacityControl.addEventListener('change', function() {
        videos.forEach(v => { v.style.opacity = this.value; });
      });
      exportBtn.addEventListener('click', function() {
        exportMode = !exportMode;
        document.body.classList.toggle('export-mode', exportMode);
        this.textContent = exportMode ? 'Exit Export' : 'Export Mode';
        if (exportMode) { currentSlide = 0; updateActiveSlide(); }
      });
      function updateActiveSlide() {
        slideWrappers.forEach((w, i) => w.classList.toggle('active', i === currentSlide));
        var ind = document.getElementById('currentSlideNum');
        if (ind) ind.textContent = currentSlide + 1;
      }
      window.prevSlide = function() { currentSlide = (currentSlide - 1 + slideWrappers.length) % slideWrappers.length; updateActiveSlide(); };
      window.nextSlide = function() { currentSlide = (currentSlide + 1) % slideWrappers.length; updateActiveSlide(); };
      document.addEventListener('keydown', function(e) {
        if (!exportMode) return;
        if (e.key === 'ArrowRight' || e.key === ' ') { currentSlide = (currentSlide + 1) % slideWrappers.length; updateActiveSlide(); }
        else if (e.key === 'ArrowLeft') { currentSlide = (currentSlide - 1 + slideWrappers.length) % slideWrappers.length; updateActiveSlide(); }
        else if (e.key === 'Escape') { exportMode = false; document.body.classList.remove('export-mode'); exportBtn.textContent = 'Export Mode'; }
      });
    })();
  </script>
</body>
</html>
