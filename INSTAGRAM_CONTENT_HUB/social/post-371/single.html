<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 371 — The Journey Continues</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #141414; --bg-card: #1A1A1A; --neutral-border: #2A2A2A; --neutral-text: #E5E5E5; --neutral-secondary: #A3A3A3; --neutral-accent: #D4D4D4; --neutral-dim: #525252; --text-primary: #e8e8e8; --text-dim: #6a6a6a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; align-items: center; }
    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .preview-label { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
    .post-frame { width: 540px; height: 540px; position: relative; background: var(--bg-dark); border-radius: 16px; overflow: hidden; border: 1px solid var(--neutral-border); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5); }
    .post-content { position: relative; z-index: 5; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 48px; text-align: center; }
    .post-type { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--neutral-accent); margin-bottom: 24px; padding: 6px 16px; border: 1px solid var(--neutral-border); border-radius: 20px; }
    .post-icon { font-size: 40px; margin-bottom: 16px; }
    .post-title { font-family: 'Inter', sans-serif; font-size: 34px; font-weight: 700; color: var(--neutral-text); line-height: 1.2; margin-bottom: 20px; max-width: 90%; }
    .divider { width: 60px; height: 3px; background: linear-gradient(90deg, var(--neutral-accent), var(--neutral-dim)); border-radius: 2px; margin-bottom: 20px; }
    .post-subtitle { font-size: 17px; color: var(--neutral-secondary); font-weight: 400; line-height: 1.5; margin-bottom: 28px; max-width: 85%; }
    .swipe-cta { font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--neutral-dim); }
    .brand-mark { position: absolute; bottom: 24px; font-size: 11px; font-weight: 500; letter-spacing: 2px; color: var(--neutral-dim); }
    .export-mode .post-frame { width: 1080px; height: 1080px; border-radius: 0; }
    .export-mode .post-content { padding: 96px; }
    .export-mode .post-title { font-size: 64px; }
    .export-mode .post-subtitle { font-size: 30px; }
    .export-mode .post-icon { font-size: 72px; }
  </style>
</head>
<body>
  <div class="preview-container">
    <span class="preview-label">Post 371 &mdash; Education</span>
    <div class="post-frame">
      <div class="post-content">
        <span class="post-type">Education</span>
        <div class="post-icon">&#x1F393;</div>
        <h1 class="post-title">The Journey Continues</h1>
        <div class="divider"></div>
        <p class="post-subtitle">400 posts is a milestone, not a finish line. Deeper explorations, new features, and advanced content ahead.</p>
        <span class="swipe-cta">Swipe to learn &rarr;</span>
        <span class="brand-mark">SIGNALPILOT</span>
      </div>
    </div>
  </div>
</body>
</html>
