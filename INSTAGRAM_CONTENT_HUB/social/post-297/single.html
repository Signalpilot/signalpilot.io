<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post 297 — Yearly Plan Best Value | Single Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #1A0F0A;
      --bg-card: #1F1410;
      --cine-orange: #E07B4B;
      --cine-orange-glow: #EA580C;
      --cine-orange-subtle: #7C2D12;
      --cine-orange-text: #FFEDD5;
      --cine-orange-secondary: #FDBA74;
      --cine-orange-accent: #F97316;
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --text-dim: #6a6a6a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .preview-label {
      font-size: 14px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .post-frame {
      width: 540px;
      height: 540px;
      position: relative;
      background: var(--bg-dark);
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 60px rgba(234, 88, 12, 0.15),
        0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .post-frame::before {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, transparent 0%, var(--cine-orange) 20%, var(--cine-orange-glow) 50%, var(--cine-orange) 80%, transparent 100%);
      z-index: 10;
    }

    .post-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, rgba(234, 88, 12, 0.1) 0%, transparent 50%, rgba(124, 45, 18, 0.05) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .post-content {
      position: relative;
      z-index: 5;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px;
      text-align: center;
    }

    .corner-accent-tr {
      position: absolute;
      top: 24px; right: 24px;
      width: 40px; height: 40px;
      border-right: 2px solid var(--cine-orange-subtle);
      border-top: 2px solid var(--cine-orange-subtle);
    }

    .corner-accent-bl {
      position: absolute;
      bottom: 24px; left: 24px;
      width: 40px; height: 40px;
      border-left: 2px solid var(--cine-orange-subtle);
      border-bottom: 2px solid var(--cine-orange-subtle);
    }

    .post-type {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cine-orange-accent);
      margin-bottom: 24px;
      padding: 6px 16px;
      border: 1px solid var(--cine-orange-subtle);
      border-radius: 20px;
    }

    .post-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 600;
      font-style: normal;
      color: var(--cine-orange-text);
      line-height: 1.2;
      margin-bottom: 16px;
      max-width: 90%;
      text-shadow: 0 2px 20px rgba(234, 88, 12, 0.2);
    }

    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cine-orange), transparent);
      margin: 20px 0;
    }

    .post-subtitle {
      font-size: 16px;
      color: var(--cine-orange-secondary);
      max-width: 80%;
      line-height: 1.6;
    }

    .cta-text {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--cine-orange);
      text-transform: uppercase;
      padding: 12px 24px;
      border: 1px solid var(--cine-orange);
      border-radius: 6px;
    }

    .brand-mark {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--cine-orange-subtle);
    }

    .export-mode .post-frame {
      width: 1080px; height: 1080px;
      border-radius: 0;
    }

    .export-mode .post-content { padding: 96px; }
    .export-mode .post-title { font-size: 72px; }
    .export-mode .post-subtitle { font-size: 28px; }

    .controls { display: flex; gap: 12px; }

    .controls button {
      padding: 10px 20px;
      background: var(--cine-orange);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .controls button:hover { background: var(--cine-orange-secondary); }
  </style>
</head>
<body>
  <div class="preview-container">
    <span class="preview-label">POST 297 — MARKETING (ORANGE)</span>

    <div class="post-frame" id="postFrame">
      <div class="corner-accent-tr"></div>
      <div class="corner-accent-bl"></div>

      <div class="post-content">
        <span class="post-type">Marketing</span>
        <h1 class="post-title">Yearly Plan: Best Value</h1>
        <div class="divider"></div>
        <p class="post-subtitle">For serious traders committed to growth. Save 52% vs monthly. Lock your rate.</p>
        <span class="cta-text">Link in Bio</span>
        <span class="brand-mark">SIGNALPILOT</span>
      </div>
    </div>

    <div class="controls">
      <button onclick="toggleExport()">Toggle Export Mode (1080x1080)</button>
    </div>
  </div>

  <script>
    function toggleExport() {
      document.body.classList.toggle('export-mode');
    }
  </script>
</body>
</html>
