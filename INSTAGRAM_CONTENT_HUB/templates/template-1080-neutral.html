<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neutral Template — 1080×1080</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .slide {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(180deg, #0c0c0c 0%, #080808 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* Very subtle white gradient */
        .slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
            pointer-events: none;
        }
        /* NO border for neutral */
        .content {
            position: relative;
            z-index: 1;
        }
        .label {
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 60px;
        }
        .title {
            font-size: 72px;
            font-weight: 600;
            line-height: 1.2;
            color: rgba(229, 229, 229, 0.9);
            margin-bottom: 40px;
            max-width: 800px;
        }
        .divider {
            width: 80px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            margin: 0 auto 40px;
        }
        .subtitle {
            font-size: 24px;
            letter-spacing: 2px;
            color: rgba(163, 163, 163, 0.7);
        }
        .logo {
            position: absolute;
            bottom: 50px;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.08);
        }
        .note {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #333;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="content">
            <div class="label">Learn</div>
            <div class="title">The Liquidity Lie</div>
            <div class="divider"></div>
            <div class="subtitle">What they don't tell you</div>
        </div>
        <div class="logo">SignalPilot</div>
    </div>
    <div class="note">Screenshot this at 1080×1080 or use browser zoom to fit</div>
</body>
</html>
