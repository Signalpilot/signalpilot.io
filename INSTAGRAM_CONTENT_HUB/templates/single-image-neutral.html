<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single Image Template — NEUTRAL (Education)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Base Colors */
      --bg-dark: #0A0A0A;
      --bg-card: #0F0F0F;

      /* Neutral Palette - Concept 03 */
      --cine-neutral: #A8A29E;
      --cine-neutral-border: #262626;
      --cine-neutral-subtle: #171717;
      --cine-neutral-text: #E5E5E5;
      --cine-neutral-secondary: #A3A3A3;
      --cine-neutral-accent: #525252;

      /* Text */
      --text-primary: #e8e8e8;
      --text-secondary: #a0a0a0;
      --text-dim: #6a6a6a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .preview-label {
      font-size: 14px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* The Instagram Post Frame */
    .post-frame {
      width: 540px;
      height: 540px;
      position: relative;
      background: var(--bg-dark);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--cine-neutral-border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    /* NO glow border for NEUTRAL - clean, understated */
    /* Subtle top gradient only */
    .post-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(168, 162, 158, 0.05) 0%,
        transparent 40%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Inner content area */
    .post-content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px;
      text-align: center;
    }

    /* Subtle corner lines */
    .corner-line-tl {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 30px;
      height: 1px;
      background: var(--cine-neutral-border);
    }

    .corner-line-tl::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 30px;
      background: var(--cine-neutral-border);
    }

    .corner-line-br {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 30px;
      height: 1px;
      background: var(--cine-neutral-border);
    }

    .corner-line-br::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 1px;
      height: 30px;
      background: var(--cine-neutral-border);
    }

    /* Post type badge */
    .post-type {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cine-neutral-secondary);
      margin-bottom: 24px;
      padding: 6px 16px;
      border: 1px solid var(--cine-neutral-border);
      border-radius: 20px;
    }

    /* Icon */
    .post-icon {
      font-size: 48px;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    /* Title */
    .post-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 600;
      color: var(--cine-neutral-text);
      line-height: 1.2;
      margin-bottom: 16px;
      max-width: 90%;
    }

    /* Divider - subtle */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--cine-neutral-accent);
      margin: 20px 0;
    }

    /* Subtitle */
    .post-subtitle {
      font-size: 15px;
      color: var(--cine-neutral-secondary);
      max-width: 85%;
      line-height: 1.6;
    }

    /* Learn tagline */
    .learn-tag {
      margin-top: 24px;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--cine-neutral-accent);
      text-transform: uppercase;
    }

    /* Brand mark */
    .brand-mark {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--cine-neutral-subtle);
    }

    /* Export mode - exact 1080x1080 */
    .export-mode .post-frame {
      width: 1080px;
      height: 1080px;
      border-radius: 0;
    }

    .export-mode .post-content {
      padding: 96px;
    }

    .export-mode .post-title {
      font-size: 68px;
    }

    .export-mode .post-subtitle {
      font-size: 26px;
    }

    .export-mode .post-icon {
      font-size: 80px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
    }

    .controls button {
      padding: 10px 20px;
      background: var(--cine-neutral-accent);
      color: var(--cine-neutral-text);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .controls button:hover {
      background: var(--cine-neutral);
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <span class="preview-label">NEUTRAL Template — Education (Center Column)</span>

    <div class="post-frame" id="postFrame">
      <div class="corner-line-tl"></div>
      <div class="corner-line-br"></div>

      <div class="post-content">
        <span class="post-type">Education</span>
        <div class="post-icon">📈</div>
        <h1 class="post-title">The Liquidity Lie</h1>
        <div class="divider"></div>
        <p class="post-subtitle">What they don't tell you about where stops get hunted</p>
        <span class="learn-tag">Swipe to learn</span>
        <span class="brand-mark">SIGNALPILOT</span>
      </div>
    </div>

    <div class="controls">
      <button onclick="toggleExport()">Toggle Export Mode (1080x1080)</button>
    </div>
  </div>

  <script>
    function toggleExport() {
      document.body.classList.toggle('export-mode');
    }
  </script>
</body>
</html>
