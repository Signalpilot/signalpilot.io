<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chronicle Template — 1080×1080</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .slide {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(180deg, #0c0c0c 0%, #080808 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* Teal gradient overlay */
        .slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(20,184,166,0.1) 0%, transparent 100%);
            pointer-events: none;
        }
        /* Left border */
        .slide::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: rgba(20,184,166,0.6);
        }
        .content {
            position: relative;
            z-index: 1;
        }
        .label {
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(20,184,166,0.5);
            margin-bottom: 50px;
        }
        .meet {
            font-size: 18px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: rgba(94, 234, 212, 0.5);
            margin-bottom: 15px;
        }
        .character-name {
            font-size: 80px;
            font-weight: 600;
            line-height: 1.1;
            color: rgba(204, 251, 241, 0.95);
            margin-bottom: 40px;
        }
        .divider {
            width: 80px;
            height: 2px;
            background: rgba(20,184,166,0.4);
            margin: 0 auto 40px;
        }
        .indicator-name {
            font-size: 22px;
            letter-spacing: 3px;
            color: rgba(94, 234, 212, 0.6);
        }
        .logo {
            position: absolute;
            bottom: 50px;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(20,184,166,0.15);
        }
        .note {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #333;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="content">
            <div class="label">The Chronicle</div>
            <div class="meet">Meet</div>
            <div class="character-name">The Sovereign</div>
            <div class="divider"></div>
            <div class="indicator-name">Pentarch TD Signal</div>
        </div>
        <div class="logo">SignalPilot</div>
    </div>
    <div class="note">Screenshot this at 1080×1080 or use browser zoom to fit</div>
</body>
</html>
